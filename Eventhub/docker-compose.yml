# docker-compose.yml
# ─── EventHub: 3-service stack (MongoDB + Express API + React/Vite) ───
# All 3 services start together via: docker-compose up --build

version: '3.8'

services:
  # ── MongoDB Database ──
  mongodb:
    image: mongo:7                      # Official MongoDB 7 image
    container_name: eventhub-mongodb
    ports:
      - "27017:27017"                   # Expose MongoDB on host port 27017
    volumes:
      - mongo_data:/data/db             # Named volume for data persistence
    networks:
      - app-network
    restart: unless-stopped

  # ── Express.js Backend API ──
  backend:
    build: ./backend                    # Builds from backend/Dockerfile
    container_name: eventhub-backend
    ports:
      - "5000:5000"                     # Expose backend on host port 5000
    environment:
      PORT: 5000
      # Use Docker's internal DNS name "mongodb" instead of localhost
      MONGO_URI: mongodb://mongodb:27017/eventhub
      JWT_SECRET: eventhub_super_secret_key_2026
    depends_on:
      - mongodb                         # Ensures MongoDB starts before the backend
    networks:
      - app-network
    restart: unless-stopped

  # ── React Frontend (served by Vite Preview) ──
  frontend:
    build: ./frontend                   # Builds from frontend/Dockerfile
    container_name: eventhub-frontend
    ports:
      - "5173:5173"                     # Expose frontend on host port 5173
    depends_on:
      - backend                         # Ensures backend starts before frontend
    networks:
      - app-network
    restart: unless-stopped

# ── Docker Network ──
# All services communicate over this bridge network
networks:
  app-network:
    driver: bridge

# ── Named Volumes ──
# Ensures MongoDB data persists across container restarts
volumes:
  mongo_data:
