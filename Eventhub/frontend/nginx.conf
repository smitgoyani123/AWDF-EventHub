# frontend/nginx.conf
# ─── Nginx configuration for the React SPA ───
# Serves static files and proxies /api/ requests to the backend container.

server {
    listen 80;
    server_name localhost;

    # Root directory where the built React files live
    root /usr/share/nginx/html;
    index index.html;

    # ── SPA Routing ──
    # For any path that doesn't match a real file, serve index.html.
    # This lets React Router handle client-side routes (e.g. /events, /my-tickets).
    # Without this, refreshing on /events would return a 404 from nginx.
    location / {
        try_files $uri /index.html;
    }

    # ── API Reverse Proxy ──
    # Forward any request starting with /api/ to the backend Express service.
    # "backend" is the Docker Compose service name, which Docker's internal DNS resolves.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
